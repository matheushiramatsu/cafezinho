<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#33479e" />
    <meta
      name="description"
      content="Sorteie quem leva o quê no cafezinho da equipe, com restrições, preferências e histórico."
    />
    <title>Cafezinho</title>
    <script>
      // Aplica o tema salvo antes da primeira pintura para evitar flash.
      try {
        var t = localStorage.getItem('cafe-da-firma:theme')
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
